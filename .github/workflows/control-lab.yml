name: Control Lab checks
on:
  push:
    branches: ['feature/doorbell-control-lab']
    paths: ['reolink_control_lab/**', 'tests/test_control_lab*.py', 'tests/requirements.txt', '.github/workflows/control-lab.yml']
  pull_request:
    paths: ['reolink_control_lab/**', 'tests/test_control_lab*.py', 'tests/requirements.txt', '.github/workflows/control-lab.yml']
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r reolink_control_lab/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_control_lab*.py' -v
      - run: docker build -t reolink-control-lab:ci reolink_control_lab
